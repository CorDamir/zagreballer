<div class="game-card" onclick="location.href='{% url 'game_info' game.id %}'">
    <table>
        <tbody>
            <tr>
                <td>Playing field:</td>
                <td>{{ game.futsal_field.name }}</td>
            </tr>
            
            <tr>
                <td>Date and time:</td>
                <td>{{ game.play_time_start | date:'l: d.m.Y G:i' }}</td>
            </tr>
            
            <tr>
                <td>City block:</td>
                <td>{{ game.futsal_field.get_location_cityblock_display }}</td>
            </tr>
        </tbody>
    </table>

    <hr>
        
    <div class="game-card-info-text">
        {{ game.custom_description }}
    </div>
</div>
