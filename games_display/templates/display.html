{% extends "index.html" %}

{% block main %}
    <div class="text-description-in-flex">
        <h2>AVAILABLE GAMES</h2>
        <hr>
    </div>

    {% if games %}
        {% for game in games %}
                {% include "card-display.html" %}
        {% endfor %}
    
    {% else %}
        <div class="text-description-in-flex">
            <h2>NO GAMES FOUND</h2>
        </div>
    {% endif %}

{% endblock %}
