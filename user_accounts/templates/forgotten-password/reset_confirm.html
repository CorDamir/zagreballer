{% extends "index.html" %}

{% block main %}
<div class="forms-container">
    <div class="form">
        <div class="header">PASSWORD RESET</div>
        {% if validlink %}
            <form method="POST">
                {% csrf_token %}
                {{ form.new_password1 }}
                {{ form.new_password2 }}
                <input type="submit" class="button" value="Change Password">
            </form>
        {% else %}
            <p>This password reset link is invalid or has expired.</p>
            <a href="{% url 'password_reset_form' %}">Request a new one</a>
        {% endif %}
    </div>
</div>
{% endblock %}
